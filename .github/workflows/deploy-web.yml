name: Check and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out the project
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Read GitHub Pages settings
        uses: actions/configure-pages@v5

      - name: Install locked dependencies
        run: npm ci

      - name: Check required public settings
        env:
          VITE_DEMO_API_URL: ${{ vars.VITE_DEMO_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: |
          if [[ "$VITE_DEMO_API_URL" != https://* ]]; then
            echo "VITE_DEMO_API_URL must be a public HTTPS Worker origin."
            exit 1
          fi
          if [[ -z "$VITE_TURNSTILE_SITE_KEY" ]]; then
            echo "VITE_TURNSTILE_SITE_KEY is missing."
            exit 1
          fi

      - name: Set GitHub Pages paths
        run: |
          repository_name="${GITHUB_REPOSITORY#*/}"
          if [[ "$repository_name" == "${GITHUB_REPOSITORY_OWNER}.github.io" ]]; then
            echo "VITE_BASE_PATH=/" >> "$GITHUB_ENV"
            echo "VITE_PUBLIC_ORIGIN=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_ENV"
          else
            echo "VITE_BASE_PATH=/${repository_name}/" >> "$GITHUB_ENV"
            echo "VITE_PUBLIC_ORIGIN=https://${GITHUB_REPOSITORY_OWNER}.github.io/${repository_name}" >> "$GITHUB_ENV"
          fi

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Check Worker package
        run: npm run build --workspace @hvac-demo/worker

      - name: Build website
        env:
          VITE_DEMO_API_URL: ${{ vars.VITE_DEMO_API_URL }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}
        run: npm run build --workspace @hvac-demo/web

      - name: Upload website files
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
